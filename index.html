<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatbot Lab</title><style>body{font:16px system-ui;background:#edf1f8;margin:0;padding:24px;color:#18233a}main{max-width:760px;margin:auto;background:white;border-radius:18px;padding:22px}h1{color:#3d55b4}#messages{height:55vh;overflow:auto;background:#f6f8fc;border-radius:12px;padding:14px}.msg{padding:11px 14px;margin:9px 0;border-radius:12px;max-width:85%;white-space:pre-wrap}.user{background:#dce7ff;margin-left:auto}.bot{background:#e7f7ef}form{display:flex;gap:8px;margin-top:12px}input{flex:1;min-width:0;padding:12px;border:1px solid #ccd4e3;border-radius:9px}button{padding:12px 18px;background:#3d55b4;color:white;border:0;border-radius:9px;cursor:pointer}small{color:#66738b}</style></head><body><main><h1>🤖 Chatbot Lab</h1><small>Demo mode works without an API key. Never put secrets in frontend code.</small><div id="messages" aria-live="polite"></div><form id="form"><input id="prompt" placeholder="Ask something…" required maxlength="4000"><button>Send</button></form></main><script>const history=[];const box=document.querySelector("#messages");function add(text,who){const d=document.createElement("div");d.className="msg "+who;d.textContent=text;box.append(d);box.scrollTop=box.scrollHeight}add("Hello! Ask a question to get started.","bot");document.querySelector("#form").onsubmit=async e=>{e.preventDefault();const input=document.querySelector("#prompt"),text=input.value.trim();if(!text)return;input.value="";add(text,"user");history.push({role:"user",content:text});try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});const data=await r.json();if(!r.ok)throw Error(data.error);add(data.reply,"bot");history.push({role:"assistant",content:data.reply})}catch(err){add(err.message||"Network error","bot")}};</script></body></html>
